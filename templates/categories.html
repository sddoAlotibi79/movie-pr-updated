<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Categories</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial;
    background:linear-gradient(160deg,#0f1f3d,#1a2e55,#0f1f3d);
}

.phone{
    width:100vw;
    height:100dvh;
    border-radius:0;
    padding:25px;
    position:fixed;
    top:0;
    left:0;
    background:linear-gradient(160deg,#0f1f3d,#1a2e55,#0f1f3d);
    color:white;
    overflow-y:auto;
}

.back{
    position:absolute;
    top:18px;
    left:22px;
    color:white;
    text-decoration:none;
    font-size:36px;
    font-weight:bold;
}

.logo{
    width:130px;
    display:block;
    margin:70px auto 35px auto;
}

.search-box{
    width:85vw;
    max-width:360px;
    height:55px;
    margin:0 auto 30px auto;
    background:rgba(255,255,255,0.18);
    border-radius:15px;
    display:flex;
    align-items:center;
    padding:0 14px;
}

.search-box input{
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    color:white;
    font-size:16px;
}

.search-box input::placeholder{color:rgba(255,255,255,0.7)}

.search-icon{
    color:white;
    font-size:23px;
    font-weight:bold;
}

.error{
    color:#ff8080;
    text-align:center;
    font-size:14px;
    margin-bottom:10px;
    font-weight:bold;
}

.categories{
    width:85vw;
    max-width:360px;
    margin:0 auto;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
}

.category-btn{
    height:90px;
    border-radius:15px;
    background:rgba(255,255,255,0.18);
    color:white;
    text-decoration:none;
    font-size:20px;
    font-weight:bold;
    display:flex;
    justify-content:center;
    align-items:center;
}
</style>
</head>

<body>
<div class="phone">

    <a href="/home" class="back">‹</a>

    <img src="{{ url_for('static', filename='logo.png') }}" class="logo">

    <form method="GET" action="/search" class="search-box">
        <input type="text" name="search" placeholder="Search..." autocomplete="off">
        <span class="search-icon">⌕</span>
    </form>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <div class="categories">
        <a href="/category/Action" class="category-btn">Action</a>
        <a href="/category/Drama" class="category-btn">Drama</a>
        <a href="/category/Sci-Fi" class="category-btn">Sci-Fi</a>
        <a href="/category/Mystery" class="category-btn">Mystery</a>
        <a href="/category/Family" class="category-btn">Family</a>
        <a href="/category/Comedy" class="category-btn">Comedy</a>
    </div>

</div>
</body>
</html>
