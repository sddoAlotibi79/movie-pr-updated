<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #0f1f3d;
}

.phone {
    width: 100vw;
    height: 100dvh;
    border-radius: 0;
    padding: 40px 25px;
    position: fixed;
    top: 0;
    left: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: linear-gradient(160deg, #0f1f3d, #1a2e55, #0f1f3d);
}

.profile {
    position: absolute;
    top: 25px;
    right: 25px;
    width: 30px;
    height: 30px;
    text-decoration: none;
}

.profile-icon {
    position: relative;
    display: block;
    width: 30px;
    height: 30px;
}

.profile-icon::before {
    content: "";
    position: absolute;
    top: 0;
    left: 10px;
    width: 10px;
    height: 10px;
    background: white;
    border-radius: 50%;
}

.profile-icon::after {
    content: "";
    position: absolute;
    bottom: 0;
    left: 4px;
    width: 22px;
    height: 13px;
    background: white;
    border-radius: 12px 12px 4px 4px;
}

.logo {
    width: 160px;
    margin-top: 120px;
    margin-bottom: 90px;
}

.btn {
    width: 85vw;
    max-width: 360px;
    height: 55px;
    margin-bottom: 18px;
    border-radius: 14px;
    border: none;
    background: rgba(255,255,255,0.18);
    color: white;
    font-size: 18px;
    font-weight: bold;
    text-align: center;
    text-decoration: none;
    display: flex;
    justify-content: center;
    align-items: center;
}

.btn:hover {
    background: white;
    color: #0f1f3d;
}
</style>
</head>

<body>

<div class="phone">

    <a href="/profile" class="profile">
        <span class="profile-icon"></span>
    </a>

    <img src="{{ url_for('static', filename='logo.png') }}" class="logo">

    <a href="/chatbot" class="btn">ChatBot</a>
    <a href="/categories" class="btn">Categories</a>

</div>

</body>
</html>
