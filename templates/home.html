<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home</title>

<style>
body {
    margin: 0;
    min-height: 100dvh;
    background: #f5f5f0;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial;
}

.phone {
    width: 94vw;
    max-width: 430px;
    height: 92dvh;
    border-radius: 30px;
    padding: 30px;
    box-sizing: border-box;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow: hidden;
    background: linear-gradient(160deg, #0f1f3d, #1a2e55, #0f1f3d);
}

.profile {
    position: absolute;
    top: 25px;
    right: 25px;
    width: 28px;
    height: 28px;
    display: block;
    text-decoration: none;
}

.profile-icon {
    position: relative;
    display: block;
    width: 28px;
    height: 28px;
}

.profile-icon::before {
    content: "";
    position: absolute;
    top: 0;
    left: 9px;
    width: 10px;
    height: 10px;
    background: white;
    border-radius: 50%;
}

.profile-icon::after {
    content: "";
    position: absolute;
    bottom: 0;
    left: 4px;
    width: 20px;
    height: 12px;
    background: white;
    border-radius: 12px 12px 4px 4px;
}

.logo {
    width: 150px;
    max-width: 45vw;
    margin-top: 90px;
    margin-bottom: 90px;
}

.btn {
    width: 80vw;
    max-width: 300px;
    height: 50px;
    margin-bottom: 15px;
    border-radius: 12px;
    border: none;
    background: rgba(255,255,255,0.15);
    color: white;
    font-weight: bold;
    text-align: center;
    text-decoration: none;
    box-sizing: border-box;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: 0.3s;
}

.btn:hover {
    background: white;
    color: #0f1f3d;
}
</style>
</head>

<body>

<div class="phone">

    <a href="/profile" class="profile">
        <span class="profile-icon"></span>
    </a>

    <img src="{{ url_for('static', filename='logo.png') }}" class="logo">

    <a href="/chatbot" class="btn">ChatBot</a>
    <a href="/categories" class="btn">Categories</a>

</div>

</body>
</html>
