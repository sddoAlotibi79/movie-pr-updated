<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movie Assistant</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial;
    background:linear-gradient(160deg,#0f1f3d,#1a2e55,#0f1f3d);
}

.phone{
    width:100vw;
    height:100dvh;
    border-radius:0;
    padding:22px;
    position:fixed;
    top:0;
    left:0;
    overflow:hidden;
    background:linear-gradient(160deg,#0f1f3d,#1a2e55,#0f1f3d);
    color:white;
}

.back{
    position:absolute;
    top:18px;
    left:22px;
    color:white;
    text-decoration:none;
    font-size:36px;
    font-weight:bold;
    z-index:10;
}

.hidden{display:none!important}

.start-screen{
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

.start-icon-box{
    width:190px;
    height:190px;
    border:4px solid rgba(255,255,255,0.18);
    border-radius:28px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:28px;
}

.start-logo{width:115px}

.start-title{
    font-size:26px;
    font-weight:bold;
    margin-bottom:14px;
    text-align:center;
}

.start-text{
    width:85vw;
    max-width:360px;
    text-align:center;
    line-height:1.7;
    color:rgba(255,255,255,0.75);
    margin-bottom:30px;
    font-size:17px;
}

.start-btn{
    width:85vw;
    max-width:360px;
    height:55px;
    border-radius:14px;
    border:none;
    background:rgba(255,255,255,0.18);
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.chat-screen{
    height:100%;
    display:flex;
    flex-direction:column;
    padding-top:20px;
}

.chat-title{
    text-align:center;
    font-size:24px;
    font-weight:bold;
    margin-top:6px;
    margin-bottom:16px;
}

.messages{
    flex:1;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:12px;
    padding-right:6px;
}

.message-wrap{
    display:flex;
    flex-direction:column;
    gap:8px;
    max-width:82%;
}

.bot-wrap{align-self:flex-start}
.user-wrap{align-self:flex-end;align-items:flex-end}

.message{
    padding:14px 16px;
    border-radius:18px;
    line-height:1.6;
    white-space:pre-line;
    word-wrap:break-word;
    font-size:15px;
}

.bot-message{background:rgba(255,255,255,0.16)}
.user-message{background:rgba(177,191,231,0.55)}

.poster-card{
    width:160px;
    border-radius:16px;
    overflow:hidden;
    background:rgba(255,255,255,0.12);
    padding:8px;
}

.poster-card img{
    width:100%;
    border-radius:12px;
}

.movie-link-btn{
    display:inline-block;
    text-decoration:none;
    border-radius:14px;
    padding:10px 14px;
    background:rgba(255,255,255,0.18);
    color:white;
    font-size:13px;
    font-weight:bold;
}

.quick-buttons{
    display:flex;
    gap:10px;
    overflow-x:auto;
    margin-top:14px;
    margin-bottom:14px;
    padding-bottom:4px;
    scrollbar-width:none;
}

.quick-buttons::-webkit-scrollbar{display:none}

.quick-btn{
    flex:0 0 auto;
    border:none;
    border-radius:14px;
    padding:10px 14px;
    background:rgba(255,255,255,0.14);
    color:white;
    cursor:pointer;
    font-size:13px;
    white-space:nowrap;
}

.input-area{
    display:flex;
    align-items:center;
    gap:10px;
}

.chat-input{
    flex:1;
    height:50px;
    border-radius:24px;
    border:2px solid rgba(255,255,255,0.35);
    background:transparent;
    outline:none;
    padding:0 16px;
    color:white;
    font-size:15px;
}

.chat-input::placeholder{color:rgba(255,255,255,0.58)}

.send-btn{
    width:52px;
    height:52px;
    border-radius:50%;
    border:none;
    background:rgba(255,255,255,0.18);
    color:white;
    font-size:21px;
    cursor:pointer;
}

.typing-message{
    background:rgba(255,255,255,0.16);
    display:flex;
    align-items:center;
    gap:6px;
    min-width:58px;
    width:fit-content;
}

.typing-dots{
    display:flex;
    gap:4px;
}

.typing-dots span{
    width:7px;
    height:7px;
    border-radius:50%;
    background:rgba(255,255,255,0.85);
    display:inline-block;
}
</style>
</head>

<body>

<div class="phone">
    <a href="/home" class="back">‹</a>

    <div id="startScreen" class="start-screen">
        <div class="start-icon-box">
            <img src="{{ url_for('static', filename='logo.png') }}" class="start-logo" alt="Movie Assistant Logo">
        </div>

        <div class="start-title">Welcome to Chat</div>

        <div class="start-text">
            Hello, I’m your Movie Assistant. I can help you find movies by mood, genre, favorites, or details.
        </div>

        <button class="start-btn" onclick="startChat()">Start the chat</button>
    </div>

    <div id="chatScreen" class="chat-screen hidden">
        <div class="chat-title">Movie Assistant</div>
        <div id="messages" class="messages"></div>
        <div id="quickButtons" class="quick-buttons"></div>

        <div class="input-area">
            <input id="userInput" class="chat-input" type="text" placeholder="Type your message...">
            <button class="send-btn" onclick="sendMessage()">➤</button>
        </div>
    </div>
</div>

<script>
let chatStarted = false;

function startChat() {
    document.getElementById("startScreen").classList.add("hidden");
    document.getElementById("chatScreen").classList.remove("hidden");

    if (!chatStarted) {
        addTextMessage("Hello! I'm your Movie Assistant.\nHow can I help you today?", "bot");
        renderQuickButtons([
            "recommend by favorites",
            "recommend by mood",
            "do you have Interstellar?",
            "show my favorites"
        ]);
        chatStarted = true;
        document.getElementById("userInput").focus();
    }
}

function addTextMessage(text, sender) {
    const messages = document.getElementById("messages");
    const wrap = document.createElement("div");
    wrap.className = "message-wrap " + (sender === "user" ? "user-wrap" : "bot-wrap");

    const msg = document.createElement("div");
    msg.className = "message " + (sender === "user" ? "user-message" : "bot-message");
    msg.innerText = text;

    wrap.appendChild(msg);
    messages.appendChild(wrap);
    messages.scrollTop = messages.scrollHeight;
}

function addPoster(url) {
    const messages = document.getElementById("messages");
    const wrap = document.createElement("div");
    wrap.className = "message-wrap bot-wrap";

    const card = document.createElement("div");
    card.className = "poster-card";

    const img = document.createElement("img");
    img.src = url;
    img.alt = "Movie Poster";

    card.appendChild(img);
    wrap.appendChild(card);
    messages.appendChild(wrap);
    messages.scrollTop = messages.scrollHeight;
}

function addMovieButton(label, url) {
    const messages = document.getElementById("messages");
    const wrap = document.createElement("div");
    wrap.className = "message-wrap bot-wrap";

    const link = document.createElement("a");
    link.className = "movie-link-btn";
    link.href = url;
    link.innerText = label;

    wrap.appendChild(link);
    messages.appendChild(wrap);
    messages.scrollTop = messages.scrollHeight;
}

function renderQuickButtons(suggestions) {
    const box = document.getElementById("quickButtons");
    box.innerHTML = "";

    suggestions.forEach(text => {
        const btn = document.createElement("button");
        btn.className = "quick-btn";
        btn.innerText = text;
        btn.onclick = () => sendQuick(text);
        box.appendChild(btn);
    });
}

function addTypingIndicator() {
    const messages = document.getElementById("messages");
    const wrap = document.createElement("div");
    wrap.className = "message-wrap bot-wrap";
    wrap.id = "typingIndicator";

    const msg = document.createElement("div");
    msg.className = "message typing-message";

    const dots = document.createElement("div");
    dots.className = "typing-dots";
    dots.innerHTML = "<span></span><span></span><span></span>";

    msg.appendChild(dots);
    wrap.appendChild(msg);
    messages.appendChild(wrap);
    messages.scrollTop = messages.scrollHeight;
}

function removeTypingIndicator() {
    const typing = document.getElementById("typingIndicator");
    if (typing) typing.remove();
}

function delay(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}

async function sendMessage() {
    const input = document.getElementById("userInput");
    const message = input.value.trim();
    if (!message) return;

    addTextMessage(message, "user");
    input.value = "";
    input.focus();

    const typingStart = Date.now();
    addTypingIndicator();

    try {
        const response = await fetch("/chatbot_reply", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ message: message })
        });

        const data = await response.json();
        const elapsed = Date.now() - typingStart;

        if (elapsed < 300) await delay(300 - elapsed);

        removeTypingIndicator();
        addTextMessage(data.reply || "No reply received.", "bot");

        if (data.poster_url) addPoster(data.poster_url);
        if (data.button_label && data.button_url) addMovieButton(data.button_label, data.button_url);

        renderQuickButtons(data.suggestions || []);
        input.focus();

    } catch (error) {
        removeTypingIndicator();
        addTextMessage("Something went wrong while connecting to the chatbot.", "bot");
    }
}

function sendQuick(text) {
    const input = document.getElementById("userInput");
    input.value = text;
    sendMessage();
}

document.getElementById("userInput").addEventListener("keypress", function(event) {
    if (event.key === "Enter") sendMessage();
});
</script>

</body>
</html>
