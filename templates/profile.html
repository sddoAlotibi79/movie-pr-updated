<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Profile</title>

<style>
body {
    margin: 0;
    height: 100vh;
    background: #f5f5f0;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial;
}

.phone {
    width: 350px;
    height: 600px;
    border-radius: 30px;
    padding: 20px;
    box-sizing: border-box;
    position: relative;
    background: linear-gradient(160deg, #0f1f3d, #1a2e55, #0f1f3d);
    color: white;
    overflow-y: auto;
}

.back {
    position: absolute;
    top: 18px;
    left: 22px;
    color: white;
    text-decoration: none;
    font-size: 30px;
    font-weight: bold;
}

.logo {
    width: 90px;
    display: block;
    margin: 45px auto 30px auto;
}

.info-box {
    width: 260px;
    margin: 0 auto 12px auto;
    background: rgba(255,255,255,0.15);
    padding: 14px;
    border-radius: 13px;
    font-weight: bold;
    box-sizing: border-box;
}

.favorite-title {
    width: 260px;
    margin: 25px auto 12px auto;
    font-size: 18px;
    font-weight: bold;
}

.favorite-list {
    width: 260px;
    margin: 0 auto;
}

.favorite-item {
    background: rgba(255,255,255,0.15);
    padding: 12px;
    border-radius: 12px;
    margin-bottom: 10px;
    color: white;
    font-weight: bold;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.heart {
    color: red;
    font-size: 20px;
}

.logout {
    display: block;
    width: 130px;
    margin: 25px auto 0 auto;
    text-align: center;
    text-decoration: none;
    background: rgba(255,255,255,0.18);
    color: white;
    padding: 12px;
    border-radius: 13px;
    font-weight: bold;
}

.logout:hover {
    background: white;
    color: #0f1f3d;
}
</style>
</head>

<body>

<div class="phone">

    <a href="/home" class="back">‹</a>

    <img src="/static/logo.png" class="logo">

    <div class="info-box">
        Username: {{ username }}
    </div>

    <div class="info-box">
        Password: ********
    </div>

    <div class="favorite-title">Favorite Movies</div>

    <div class="favorite-list">
        {% if favorites %}
            {% for movie in favorites %}
                <div class="favorite-item">
                    <span>{{ movie }}</span>
                    <span class="heart">♥</span>
                </div>
            {% endfor %}
        {% else %}
            <div class="favorite-item">
                No favorite movies yet
            </div>
        {% endif %}
    </div>

    <a href="/logout" class="logout">Log Out</a>

</div>

</body>
</html>
