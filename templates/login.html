<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login</title>

<style>
body {
    margin: 0;
    height: 100vh;
    background: #f5f5f0;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial;
}

.phone {
    width: 350px;
    height: 600px;
    border-radius: 30px;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px;
    box-sizing: border-box;

    background: linear-gradient(
        160deg,
        #0f1f3d,
        #1a2e55,
        #0f1f3d
    );
}

.logo {
    width: 120px;
    margin-top: 40px;
    margin-bottom: 65px;
}

form {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
}

/* الحقول */
input {
    width: 260px;
    height: 45px;
    padding: 0 14px;
    margin-bottom: 15px;
    border-radius: 12px;
    border: none;
    outline: none;
    background: rgba(255,255,255,0.15);
    color: white;
    box-sizing: border-box;
}

input::placeholder {
    color: #ddd;
}

/* زر Login (نفس أزرار الصفحة الثانية) */
.login-button {
    width: 120px;
    height: 40px;
    border-radius: 12px;
    border: none;
    background: rgba(255,255,255,0.15);
    color: white;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
    margin-top: 10px;
}

/* عند المرور */
.login-button:hover {
    background: white;
    color: #0f1f3d;
}

.error {
    color: #ffb4b4;
    font-size: 13px;
    margin-top: 15px;
    text-align: center;
}
</style>
</head>

<body>

<div class="phone">

    <img src="{{ url_for('static', filename='logo.png') }}" class="logo">

    <form method="POST">
        <input type="text" name="username" placeholder="Username">
        <input type="password" name="password" placeholder="Password">

        <button class="login-button" type="submit">Login</button>
    </form>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

</div>

</body>
</html>
