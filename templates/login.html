<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    min-height:100dvh;
    background:#f5f5f0;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial;
}

.phone{
    width:94vw;
    max-width:430px;
    height:92dvh;
    border-radius:30px;
    padding:30px 25px;
    display:flex;
    flex-direction:column;
    align-items:center;
    background:linear-gradient(160deg,#0f1f3d,#1a2e55,#0f1f3d);
}

.logo{
    width:150px;
    max-width:45vw;
    margin-top:70px;
    margin-bottom:70px;
}

form{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
}

input{
    width:100%;
    max-width:320px;
    height:52px;
    padding:0 16px;
    margin-bottom:18px;
    border-radius:14px;
    border:none;
    outline:none;
    background:rgba(255,255,255,0.15);
    color:white;
    font-size:16px;
}

input::placeholder{color:#ddd}

.login-button{
    width:160px;
    height:48px;
    border-radius:14px;
    border:none;
    background:rgba(255,255,255,0.15);
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    margin-top:12px;
}

.login-button:hover{
    background:white;
    color:#0f1f3d;
}

.error{
    color:#ffb4b4;
    font-size:14px;
    margin-top:18px;
    text-align:center;
}
</style>
</head>

<body>
<div class="phone">

    <img src="{{ url_for('static', filename='logo.png') }}" class="logo">

    <form method="POST">
        <input type="text" name="username" placeholder="Username">
        <input type="password" name="password" placeholder="Password">
        <button class="login-button" type="submit">Login</button>
    </form>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

</div>
</body>
</html>
