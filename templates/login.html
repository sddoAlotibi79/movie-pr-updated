<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial;
    background:linear-gradient(160deg,#0f1f3d,#1a2e55,#0f1f3d);
}

.phone{
    width:100vw;
    height:100dvh;
    border-radius:0;
    padding:35px 25px;
    position:fixed;
    top:0;
    left:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    background:linear-gradient(160deg,#0f1f3d,#1a2e55,#0f1f3d);
}

.logo{
    width:160px;
    margin-top:120px;
    margin-bottom:80px;
}

form{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
}

input{
    width:85vw;
    max-width:360px;
    height:55px;
    padding:0 16px;
    margin-bottom:18px;
    border-radius:14px;
    border:none;
    outline:none;
    background:rgba(255,255,255,0.18);
    color:white;
    font-size:16px;
}

input::placeholder{color:#ddd}

.login-button{
    width:180px;
    height:52px;
    border-radius:14px;
    border:none;
    background:rgba(255,255,255,0.18);
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    margin-top:12px;
}

.error{
    color:#ffb4b4;
    font-size:14px;
    margin-top:18px;
    text-align:center;
}
</style>
</head>

<body>
<div class="phone">

    <img src="{{ url_for('static', filename='logo.png') }}" class="logo">

    <form method="POST">
        <input type="text" name="username" placeholder="Username">
        <input type="password" name="password" placeholder="Password">
        <button class="login-button" type="submit">Login</button>
    </form>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

</div>
</body>
</html>
