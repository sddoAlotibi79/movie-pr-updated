<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login</title>

<style>

body{
    margin:0;
    min-height:100vh;
    background:#f5f5f0;

    display:flex;
    justify-content:center;
    align-items:center;

    font-family:Arial;

    padding:20px;
    box-sizing:border-box;
}

.phone{

    width:90%;
    max-width:430px;

    min-height:650px;

    border-radius:30px;

    display:flex;
    flex-direction:column;
    align-items:center;

    padding:35px 25px;

    box-sizing:border-box;

    background:linear-gradient(
        160deg,
        #0f1f3d,
        #1a2e55,
        #0f1f3d
    );
}

.logo{
    width:150px;

    margin-top:40px;
    margin-bottom:70px;
}

form{
    width:100%;

    display:flex;
    flex-direction:column;
    align-items:center;
}

input{

    width:100%;
    max-width:320px;

    height:52px;

    padding:0 16px;

    margin-bottom:18px;

    border-radius:14px;

    border:none;
    outline:none;

    background:rgba(255,255,255,0.15);

    color:white;

    font-size:16px;

    box-sizing:border-box;
}

input::placeholder{
    color:#ddd;
}

.login-button{

    width:160px;
    height:48px;

    border-radius:14px;

    border:none;

    background:rgba(255,255,255,0.15);

    color:white;

    font-size:16px;
    font-weight:bold;

    cursor:pointer;

    transition:0.3s;

    margin-top:12px;
}

.login-button:hover{
    background:white;
    color:#0f1f3d;
}

.error{
    color:#ffb4b4;

    font-size:14px;

    margin-top:18px;

    text-align:center;
}

/* للجوال */
@media (max-width:600px){

    .phone{
        width:100%;
        min-height:85vh;
        border-radius:25px;
    }

    .logo{
        width:130px;
    }

    input{
        max-width:100%;
    }
}

</style>

</head>

<body>

<div class="phone">

    <img src="{{ url_for('static', filename='logo.png') }}" class="logo">

    <form method="POST">

        <input type="text" name="username" placeholder="Username">

        <input type="password" name="password" placeholder="Password">

        <button class="login-button" type="submit">
            Login
        </button>

    </form>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

</div>

</body>
</html>
