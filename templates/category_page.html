<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ category_name }}</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{

    margin:0;
    padding:0;

    width:100%;
    height:100%;

    overflow:hidden;

    font-family:Arial;

    background:#0f1f3d;
}

/* الشاشة كاملة */
.phone{

    position:fixed;

    top:0;
    left:0;

    width:100vw;
    height:100dvh;

    padding:22px;

    overflow-y:auto;

    background:linear-gradient(
        160deg,
        #0f1f3d,
        #1a2e55,
        #0f1f3d
    );

    color:white;
}

/* رجوع */
.back{

    position:absolute;

    top:18px;
    left:22px;

    color:white;

    text-decoration:none;

    font-size:38px;
    font-weight:bold;
}

/* العنوان */
.title{

    text-align:center;

    margin-top:25px;
    margin-bottom:20px;

    font-size:28px;
    font-weight:bold;
}

/* قائمة الأفلام */
.movies-list{

    width:100%;

    margin:0 auto;
}

/* كرت الفيلم */
.movie-card{

    width:100%;

    min-height:95px;

    margin-bottom:14px;

    background:rgba(255,255,255,0.15);

    border-radius:18px;

    padding:10px;

    display:flex;

    align-items:center;

    position:relative;
}

/* رابط الفيلم */
.movie-link{

    display:flex;

    align-items:center;

    text-decoration:none;

    color:white;

    width:100%;
}

/* صورة الفيلم */
.movie-card img{

    width:70px;
    height:82px;

    object-fit:cover;

    border-radius:12px;

    margin-right:14px;
}

/* اسم الفيلم */
.movie-name{

    font-weight:bold;

    font-size:18px;

    width:100%;
}

/* القلب */
.favorite-form{

    position:absolute;

    right:14px;
    top:30px;
}

.heart-btn{

    border:none;

    background:transparent;

    color:white;

    font-size:28px;

    cursor:pointer;
}

.heart-btn.red{
    color:red;
}

/* عنوان الرسم */
.chart-title{

    text-align:center;

    margin-top:24px;
    margin-bottom:14px;

    font-weight:bold;

    font-size:18px;
}

/* الرسم */
.vertical-chart{

    width:100%;

    height:220px;

    background:rgba(255,255,255,0.10);

    border-radius:18px;

    padding:14px 10px 40px 10px;

    display:flex;

    align-items:flex-end;

    justify-content:space-around;

    gap:8px;

    margin-bottom:25px;
}

.bar-box{

    height:100%;

    width:55px;

    display:flex;

    flex-direction:column;

    justify-content:flex-end;

    align-items:center;
}

.bar-views{

    font-size:11px;

    margin-bottom:5px;
}

.bar{

    width:28px;

    background:rgba(255,255,255,0.75);

    border-radius:8px 8px 0 0;
}

.bar-name{

    font-size:10px;

    text-align:center;

    margin-top:5px;

    width:55px;

    color:white;
}

</style>
</head>

<body>

<div class="phone">

    <a href="/categories" class="back">‹</a>

    <div class="title">
        {{ category_name }}
    </div>

    <div class="movies-list">

        {% for movie in movies %}

        <div class="movie-card">

            <a href="/movie/{{ movie.title }}" class="movie-link">

                <img src="{{ movie.image }}" alt="{{ movie.title }}">

                <div class="movie-name">
                    {{ movie.title }}
                </div>

            </a>

            <form method="POST" action="/toggle_favorite" class="favorite-form">

                <input type="hidden" name="movie_title" value="{{ movie.title }}">

                <input type="hidden" name="category_name" value="{{ category_name }}">

                {% if movie.title in favorites %}

                    <button class="heart-btn red" type="submit">♥️</button>

                {% else %}

                    <button class="heart-btn" type="submit">♡</button>

                {% endif %}

            </form>

        </div>

        {% endfor %}

    </div>

    <div class="chart-title">
        Most Watched
    </div>

    <div class="vertical-chart">

        {% for movie in movies %}

        <div class="bar-box">

            <div class="bar-views">
                {{ movie.views }}
            </div>

            <div class="bar" style="height: {{ movie.bar_height }}px;"></div>

            <div class="bar-name">
                {{ movie.title }}
            </div>

        </div>

        {% endfor %}

    </div>

</div>

</body>
</html>
