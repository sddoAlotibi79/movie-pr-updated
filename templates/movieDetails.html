<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ movie.title }}</title>

<style>
*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial;
    background:linear-gradient(
        160deg,
        #0f1f3d,
        #1a2e55,
        #0f1f3d
    );
}

.phone{

    width:100vw;
    height:100dvh;

    position:fixed;
    top:0;
    left:0;

    padding:25px;

    overflow-y:auto;

    background:linear-gradient(
        160deg,
        #0f1f3d,
        #1a2e55,
        #0f1f3d
    );

    color:white;
}

/* زر الرجوع */
.back{
    position:absolute;
    top:18px;
    left:22px;

    color:white;
    text-decoration:none;

    font-size:38px;
    font-weight:bold;
}

/* صورة الفيلم */
.movie-img{

    width:180px;
    height:255px;

    object-fit:cover;

    border-radius:18px;

    display:block;

    margin:70px auto 20px auto;
}

/* اسم الفيلم */
.movie-title{

    text-align:center;

    font-size:28px;
    font-weight:bold;

    margin-bottom:12px;
}

/* التقييم */
.rating{

    text-align:center;

    font-size:20px;
    font-weight:bold;

    margin-bottom:20px;
}

/* القصة */
.story{

    width:100%;

    background:rgba(255,255,255,0.16);

    padding:18px;

    border-radius:18px;

    line-height:1.8;

    font-size:16px;

    margin-bottom:22px;
}

/* الفيديو */
iframe{

    width:100%;

    height:260px;

    border:none;

    border-radius:18px;

    margin-bottom:20px;
}
</style>
</head>

<body>

<div class="phone">

    <a href="javascript:history.back()" class="back">‹</a>

    <img src="{{ movie.image }}" class="movie-img">

    <div class="movie-title">
        {{ movie.title }}
    </div>

    <div class="rating">
        Rating: {{ movie.rating }}/10
    </div>

    <div class="story">
        {{ movie.story }}
    </div>

    {% if movie.video %}

        <iframe
            src="{{ movie.video }}"
            allowfullscreen>
        </iframe>

    {% else %}

        <div class="story">
            No video available.
        </div>

    {% endif %}

</div>

</body>
</html>
