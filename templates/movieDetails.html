<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{{ movie.title }}</title>

<style>
body {
    margin: 0;
    height: 100vh;
    background: #f5f5f0;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial;
}

.phone {
    width: 350px;
    height: 600px;
    border-radius: 30px;
    padding: 20px;
    box-sizing: border-box;
    background: linear-gradient(160deg, #0f1f3d, #1a2e55, #0f1f3d);
    color: white;
    overflow-y: auto;
}

.back {
    color: white;
    text-decoration: none;
    font-size: 30px;
    font-weight: bold;
}

.movie-img {
    width: 120px;
    height: 170px;
    object-fit: cover;
    border-radius: 15px;
    display: block;
    margin: 10px auto;
}

.movie-title {
    text-align: center;
    font-size: 22px;
    font-weight: bold;
    margin: 10px 0;
}

.rating {
    text-align: center;
    font-size: 17px;
    margin-bottom: 15px;
    font-weight: bold;
}

.story {
    background: rgba(255,255,255,0.15);
    padding: 12px;
    border-radius: 15px;
    line-height: 1.5;
    font-size: 14px;
    margin-bottom: 15px;
}

iframe {
    width: 100%;
    height: 190px;
    border: none;
    border-radius: 15px;
}
</style>
</head>

<body>

<div class="phone">

    <a href="javascript:history.back()" class="back">‹</a>

    <img src="{{ movie.image }}" class="movie-img">

    <div class="movie-title">
        {{ movie.title }}
    </div>

    <div class="rating">
        Rating: {{ movie.rating }}/10
    </div>

    <div class="story">
        {{ movie.story }}
    </div>

    {% if movie.video %}
        <iframe src="{{ movie.video }}" allowfullscreen></iframe>
    {% else %}
        <div class="story">No video available.</div>
    {% endif %}

</div>

</body>
</html>
