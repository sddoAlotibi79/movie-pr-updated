<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ movie.title }}</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    min-height:100dvh;
    background:#f5f5f0;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial;
}

.phone{
    width:94vw;
    max-width:430px;
    height:92dvh;
    border-radius:30px;
    padding:20px;
    background:linear-gradient(160deg,#0f1f3d,#1a2e55,#0f1f3d);
    color:white;
    overflow-y:auto;
}

.back{
    color:white;
    text-decoration:none;
    font-size:34px;
    font-weight:bold;
}

.movie-img{
    width:145px;
    height:205px;
    object-fit:cover;
    border-radius:15px;
    display:block;
    margin:10px auto;
}

.movie-title{
    text-align:center;
    font-size:24px;
    font-weight:bold;
    margin:12px 0;
}

.rating{
    text-align:center;
    font-size:18px;
    margin-bottom:15px;
    font-weight:bold;
}

.story{
    background:rgba(255,255,255,0.15);
    padding:14px;
    border-radius:15px;
    line-height:1.6;
    font-size:15px;
    margin-bottom:15px;
}

iframe{
    width:100%;
    height:220px;
    border:none;
    border-radius:15px;
}
</style>
</head>

<body>
<div class="phone">

    <a href="javascript:history.back()" class="back">‹</a>

    <img src="{{ movie.image }}" class="movie-img">

    <div class="movie-title">{{ movie.title }}</div>

    <div class="rating">Rating: {{ movie.rating }}/10</div>

    <div class="story">{{ movie.story }}</div>

    {% if movie.video %}
        <iframe src="{{ movie.video }}" allowfullscreen></iframe>
    {% else %}
        <div class="story">No video available.</div>
    {% endif %}

</div>
</body>
</html>
